<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL AI Chatbot - Gesture Analyzer</title>
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Link to existing global styles -->
    <link rel="stylesheet" href="style.css">

    <!-- Puter.js for Free OpenAI API Access -->
    <script src="https://js.puter.com/v2/"></script>
</head>

<body>
    <div class="chat-app-wrapper">
        <!-- Ultra Minimalist Header -->
        <header class="minimal-header">
            <div class="header-content">
                <div class="logo">
                    <h1>ASL <span class="highlight">Analyzer</span></h1>
                </div>

                <nav class="nav-minimal">
                    <a href="index.html" class="nav-link">Alphabet</a>
                    <a href="chat.html" class="nav-link active">Chat</a>
                    <button id="puter-signout-btn" class="nav-link" style="background: none; border: none; cursor: pointer; color: #ff4d4d;">Sign Out</button>
                </nav>
            </div>
        </header>

        <main class="main-content chat-page-minimal">
            <!-- Center align, constrained max-width strictly like ChatGPT -->
            <div class="chat-container-minimal">

                <!-- Chat History Area -->
                <div id="chat-history" class="chat-history scroll-container">

                    <!-- Welcome Message -->
                    <div class="chat-message ai-message">
                        <div class="avatar-minimal ai-avatar-minimal">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
                            </svg>
                        </div>
                        <div class="bubble-minimal">
                            <p>Hello. I am your ASL Translation assistant.</p>
                            <p>Upload a photo of an ASL sign or gesture below, and I will analyze its meaning instantly.
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Floating Command Bar Wrapper -->
                <div class="command-bar-wrapper">

                    <!-- Stylish Image Preview Card -->
                    <div id="image-preview-container" class="attachment-card-minimal hidden">
                        <div class="attachment-image-wrapper">
                            <img id="image-preview" src="" alt="Attached Image">
                            <button id="remove-image-btn" class="remove-btn-minimal" aria-label="Remove image">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                            </button>
                        </div>
                        <span class="attachment-label">Image attached</span>
                    </div>

                    <!-- Integrated Input Bar -->
                    <div class="chat-input-area command-bar-minimal">

                        <!-- Hidden File Input -->
                        <input type="file" id="image-upload" accept="image/*" class="hidden">

                        <button id="attach-btn" class="icon-btn-minimal" aria-label="Upload image">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                            </svg>
                        </button>

                        <textarea id="chat-input" placeholder="Message ASL Analyzer..." rows="1"></textarea>

                        <button id="send-btn" class="icon-btn-minimal send-active" aria-label="Send query">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10" />
                                <path d="m16 12-4-4-4 4" />
                                <path d="M12 16V8" />
                            </svg>
                        </button>
                    </div>
                    <div class="ai-disclaimer-minimal">AI can make mistakes. Verify important gestures.</div>
                </div>
            </div>
        </main>
    </div>

    <script src="chat.js?v=2"></script>
</body>

</html>
